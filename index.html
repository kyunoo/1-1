<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 기타 톤 시뮬레이터 (Harness Engineering)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffb703;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #9e9e9e;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2c2c2c;
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        h3 {
            margin-top: 0;
            color: #219ebc;
        }
        button {
            background-color: #219ebc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #023047;
        }
        button.active {
            background-color: #ffb703;
            color: #121212;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ffb703;
        }
        input[type="file"] {
            color: #e0e0e0;
            margin-top: 5px;
        }
        canvas {
            width: 100%;
            height: 120px;
            background-color: #000;
            border-radius: 6px;
            border: 1px solid #444;
            margin-top: 10px;
        }
        .status {
            font-size: 13px;
            color: #8ecae6;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>🎸 Web Guitar Tone Simulator</h1>
    <p class="subtitle">Test Harness Architecture</p>

    <div class="container">
        <!-- 1. 입력 소스 선택 섹션 -->
        <div class="section">
            <h3>1. Input Source (입력 소스)</h3>
            <button id="btnRealMic" onclick="setSource('mic')">실제 기타 (오디오 인터페이스/마이크)</button>
            <button id="btnVirtual" onclick="setVirtualPluck()">가상 기타 튕기기 (Pluck)</button>
            <div style="margin-top: 10px;">
                <label for="audioFile">또는 오디오 파일 업로드 (Re-amping):</label>
                <input type="file" id="audioFile" accept="audio/*" onchange="loadAudioFile(event)">
            </div>
            <div class="status" id="statusText">상태: 대기 중 (오디오 시작 버튼을 누르세요)</div>
            <button id="btnStart" style="background-color: #d90429; margin-top: 10px;" onclick="initAudioContext()">오디오 시스템 활성화 (Start)</button>
        </div>

        <!-- 2. 이펙터 체인 섹션 -->
        <div class="section">
            <h3>2. Effects Chain (이펙터 랙)</h3>
            
            <div class="control-group">
                <label>Comp Threshold (컴프레서 피크 제어): <span id="compVal">-24</span> dB</label>
                <input type="range" min="-50" max="0" value="-24" oninput="updateComp(this.value)">
            </div>

            <div class="control-group">
                <label>Amp Drive (디스토션 앰프): <span id="driveVal">5</span></label>
                <input type="range" min="0" max="50" value="5" oninput="updateDrive(this.value)">
            </div>

            <div class="control-group">
                <label>Delay Time (딜레이 시간): <span id="delayVal">0.3</span> s</label>
                <input type="range" min="0.05" max="1.0" step="0.05" value="0.3" oninput="updateDelay(this.value)">
            </div>

            <div class="control-group">
                <label>Delay Feedback (잔향 반복): <span id="fbVal">0.3</span></label>
                <input type="range" min="0" max="0.8" step="0.05" value="0.3" oninput="updateFeedback(this.value)">
            </div>

            <div class="control-group">
                <label>Master Volume (출력 볼륨): <span id="volVal">0.8</span></label>
                <input type="range" min="0" max="1" step="0.05" value="0.8" oninput="updateVolume(this.value)">
            </div>
        </div>

        <!-- 3. 실시간 오실로스코프 모니터링 -->
        <div class="section">
            <h3>3. Output Monitor (오실로스코프)</h3>
            <canvas id="oscilloscope"></canvas>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let compressor, waveShaper, delayNode, feedbackNode, masterGain, analyser;
        let sourceNode = null;
        let currentSourceType = null;
        let audioBuffer = null;
        let fileSourceNode = null;

        function initAudioContext() {
            if (audioCtx) return;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // 1. 컴프레서 노드 생성
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
            compressor.knee.setValueAtTime(30, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.250, audioCtx.currentTime);

            // 2. 웨이브셰이퍼 (디스토션 앰프) 생성
            waveShaper = audioCtx.createWaveShaper();
            updateDrive(5);

            // 3. 딜레이 및 피드백 노드 생성
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.setValueAtTime(0.3, audioCtx.currentTime);
            
            feedbackNode = audioCtx.createGain();
            feedbackNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            // 딜레이 루프 연결 (Delay -> Feedback -> Delay)
            delayNode.connect(feedbackNode);
            feedbackNode.connect(delayNode);

            // 4. 마스터 볼륨 노드
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

            // 5. 오실로스코프용 Analyser 노드
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;

            // 전체 이펙터 체인 라우팅 직렬 연결
            // Input -> Compressor -> WaveShaper -> Delay (+ Dry) -> MasterGain -> Analyser -> Destination
            compressor.connect(waveShaper);
            waveShaper.connect(delayNode);
            waveShaper.connect(masterGain); // Dry 신호
            delayNode.connect(masterGain);   // Wet(딜레이) 신호
            
            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            document.getElementById('statusTextinnerText'] = "상태: 오디오 시스템 활성화 완료!";
            startOscilloscope();
            alert("오디오 시스템이 활성화되었습니다! 입력 소스를 선택해주세요.");
        }

        // 입력 소스 전환 함수 (실제 마이크 / 기타)
        async function setSource(type) {
            if (!audioCtx) { alert("먼저 '오디오 시스템 활성화' 버튼을 눌러주세요!"); return; }
            if (audioCtx.state === 'suspended') { await audioCtx.resume(); }

            stopCurrentSource();
            currentSourceType = type;

            if (type === 'mic') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } });
                    sourceNode = audioCtx.createMediaStreamSource(stream);
                    sourceNode.connect(compressor);
                    document.getElementById('statusText').innerText = "상태: 실제 기타/마이크 입력 연결됨";
                } catch (err) {
                    alert("마이크/오디오 인터페이스 권한이 거부되었거나 장치를 찾을 수 없습니다.");
                }
            }
        }

        // 가상 기타 튕기기 (Pluck 신호 생성)
        function setVirtualPluck() {
            if (!audioCtx) { alert("먼저 '오디오 시스템 활성화' 버튼을 눌러주세요!"); return; }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            stopCurrentSource();
            
            // 짧은 화이트 노이즈 버스트를 만들어 기타 줄을 튕기는 듯한 물리 소리 합성
            const bufferSize = audioCtx.sampleRate * 0.1; // 0.1초
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.02));
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = buffer;
            sourceNode.loop = true;
            sourceNode.connect(compressor);
            sourceNode.start();

            document.getElementById('statusText').innerText = "상태: 가상 기타 스트럼(Pluck) 시뮬레이션 중";
        }

        // 업로드한 오디오 파일 로드
        function loadAudioFile(event) {
            if (!audioCtx) { alert("먼저 '오디오 시스템 활성화' 버튼을 눌러주세요!"); return; }
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function(e) {
                audioCtx.decodeAudioData(e.target.result, function(buffer) {
                    audioBuffer = buffer;
                    playAudioBuffer();
                });
            };
        }

        function playAudioBuffer() {
            stopCurrentSource();
            if (!audioBuffer) return;
            fileSourceNode = audioCtx.createBufferSource();
            fileSourceNode.buffer = audioBuffer;
            fileSourceNode.loop = true;
            fileSourceNode.connect(compressor);
            fileSourceNode.start();
            document.getElementById('statusText').innerText = "상태: 업로드된 오디오 파일 재생 중 (Re-amping)";
        }

        function stopCurrentSource() {
            if (sourceNode && sourceNode.stop) { try { sourceNode.stop(); } catch(e){} }
            if (fileSourceNode && fileSourceNode.stop) { try { fileSourceNode.stop(); } catch(e){} }
        }

        // 이펙터 파라미터 조절 함수들
        function updateComp(val) {
            document.getElementById('compVal').innerText = val;
            if (compressor) compressor.threshold.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        function updateDrive(amount) {
            document.getElementById('driveVal').innerText = amount;
            if (!waveShaper) return;
            
            const k = parseFloat(amount);
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            
            for (let i = 0; i < n_samples; ++i) {
                let x = (i * 2) / n_samples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            waveShaper.curve = curve;
        }

        function updateDelay(val) {
            document.getElementById('delayVal').innerText = val;
            if (delayNode) delayNode.delayTime.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        function updateFeedback(val) {
            document.getElementById('fbVal').innerText = val;
            if (feedbackNode) feedbackNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        function updateVolume(val) {
            document.getElementById('volVal').innerText = val;
            if (masterGain) masterGain.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        // 오실로스코프 시각화 렌더링 루프
        function startOscilloscope() {
            const canvas = document.getElementById('oscilloscope');
            const canvasCtx = canvas.getContext('2d');
            
            function draw() {
                requestAnimationFrame(draw);
                
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteTimeDomainData(dataArray);

                canvasCtx.fillStyle = '#000000';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = '#219ebc';
                canvasCtx.beginPath();

                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;

                    if (i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();
            }
            draw();
        }
    </script>
</body>
</html>
